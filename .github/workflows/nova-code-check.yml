name: NOVA Code Check
on:
  push:
    paths:
      - "engine/**"
      - "server/**"
      - ".github/workflows/nova-code-check.yml"
  pull_request:
    paths:
      - "engine/**"
      - "server/**"
      - ".github/workflows/nova-code-check.yml"
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install API dependencies
        run: pip install -r server/requirements.txt
      - name: Install engine dependency
        run: pip install "torch>=2.4"
      - name: Compile Python modules
        run: python -m compileall -q engine server
      - name: Import API
        run: python -c "from server.app import app; print(app.title, app.version)"
      - name: Run native autoencoder smoke test
        run: python -m engine.autoencoder_smoke_test
      - name: Run native autoencoder learning regression test
        run: python -m engine.autoencoder_learning_test
      - name: Run native latent denoiser smoke test
        run: python -m engine.latent_smoke_test
      - name: Run native latent learning regression test
        run: python -m engine.latent_learning_test
      - name: Generate synthetic training sample
        run: python -m engine.synthetic_dataset --samples 16 --output /tmp/nova-synthetic
      - name: Validate synthetic training sample
        run: python -m engine.validate_synthetic --root /tmp/nova-synthetic
      - name: Build dataset checksum manifest
        run: python -m engine.dataset_manifest --root /tmp/nova-synthetic --output /tmp/nova-manifest.json
      - name: Train one native autoencoder epoch
        run: python -m engine.train_autoencoder --root /tmp/nova-synthetic --epochs 2 --batch-size 4 --out /tmp/nova-ae.pt
      - name: Evaluate native autoencoder checkpoint
        run: python -m engine.evaluate_autoencoder --root /tmp/nova-synthetic --checkpoint /tmp/nova-ae.pt.best --batch-size 4
      - name: Train tiny native latent profile
        run: >-
          python -m engine.train_latent
          --data-root /tmp/nova-synthetic
          --autoencoder-checkpoint /tmp/nova-ae.pt
          --epochs 1
          --batch-size 4
          --out /tmp/nova-latent.pt
          --model-dim 32
          --num-heads 4
          --num-layers 1
          --diffusion-steps 8
      - name: Run native end-to-end inference smoke test
        run: >-
          python -m engine.latent_inference
          --autoencoder /tmp/nova-ae.pt
          --latent /tmp/nova-latent.pt
          --prompt "a red circle moving in a dark scene"
          --frames 8
          --height 32
          --width 32
          --output /tmp/nova-native.pt
          --seed 0
      - name: Validate native inference tensor
        run: >-
          python -c "import torch; x=torch.load('/tmp/nova-native.pt', weights_only=True); assert x.shape == (1,3,8,32,32); assert torch.isfinite(x).all(); print('native tensor OK', tuple(x.shape))"
      - name: Compile native exporter
        run: python -m compileall -q engine/export_video.py
      - name: Run native video exporter smoke test
        run: python -m engine.export_video_smoke_test
