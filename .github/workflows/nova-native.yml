name: NOVA Native CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch pillow fastapi pydantic httpx pytest

      - name: Check FFmpeg
        run: ffmpeg -version

      - name: API contract tests
        run: pytest -q server/test_app.py

      - name: Synthetic dataset validation
        run: python -m engine.validate_synthetic

      - name: Native capacity profile regression
        run: pytest -q engine/capacity_profile_test.py

      - name: Native autoencoder smoke test
        run: python -m engine.autoencoder_smoke_test

      - name: Native autoencoder learning regression
        run: python -m engine.autoencoder_learning_test

      - name: Tiny native training profile
        run: python -m engine.ci_training_profile

      - name: Upload tiny native checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: nova-native-ci-checkpoint
          path: checkpoints/ci_nova_ae.pt

      - name: NOVA Micro CPU learning profile
        run: python -m engine.micro_profile

      - name: Upload NOVA Micro checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: nova-micro-checkpoints
          path: |
            checkpoints/nova_micro_ae.pt
            checkpoints/nova_micro_latent.pt
            checkpoints/nova_micro_latent_history.jsonl

      - name: NOVA Micro prompt-to-video regression
        run: python -m engine.micro_generation_test

      - name: Native prompt conditioning regression
        run: python -m engine.prompt_conditioning_test

      - name: DDIM sampler regression
        run: python -m engine.ddim_sampler_test

      - name: Latent model smoke test
        run: python -m engine.latent_smoke_test

      - name: Latent learning regression
        run: python -m engine.latent_learning_test

      - name: Video export smoke test
        run: python -m engine.export_video_smoke_test

      - name: Rights-safe real-video pipeline smoke test
        run: python -m engine.real_video_prepare_smoke_test
